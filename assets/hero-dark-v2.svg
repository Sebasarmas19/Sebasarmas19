<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Sebastian Armas — Tools change. Solving problems doesn't.">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#191B20"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#F5F0E6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F5F0E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGridDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F5F0E6" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="1" y="1" width="898" height="248" rx="18" fill="url(#bgDark)" stroke="#2D3139" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="248" rx="18" fill="url(#dotGridDark)"/>
  <rect x="1" y="1" width="898" height="248" rx="18" fill="url(#warmGlow)"/>

  <!-- Top Metadata Row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="40" y="28" width="42" height="24" rx="12" fill="#1E2128" stroke="#3A3F4B" stroke-width="1"/>
    <text x="61" y="44" text-anchor="middle" fill="#F5F0E6" font-size="11" font-weight="700" letter-spacing="1">SA</text>
    <text x="94" y="44" fill="#9E988E" font-size="11" font-weight="600" letter-spacing="2">CARACAS — REMOTE</text>

    <!-- Status Pill -->
    <rect x="664" y="28" width="196" height="24" rx="12" fill="#1A2420" stroke="#2D4A3E" stroke-width="1"/>
    <circle cx="682" cy="40" r="4" fill="#4ADE80"/>
    <text x="694" y="44" fill="#D4E8DC" font-size="10.5" font-weight="600" letter-spacing="1">AVAILABLE TO BUILD</text>
  </g>

  <!-- Editorial Headline -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="102" fill="#F5F0E6" font-size="36" font-weight="800" letter-spacing="-0.6">Tools change.</text>
    <text x="40" y="142" fill="#B5ACA0" font-size="32" font-weight="700" letter-spacing="-0.4">Solving problems doesn't.</text>
    <text x="40" y="175" fill="#D5CEC4" font-size="14.5" font-weight="500">Sebastian Armas  ·  Full Stack Developer &amp; AI Engineer  ·  Computer Engineering @ UCAB</text>
  </g>

  <!-- 4 Core Pillar Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">
    <rect x="40" y="196" width="66" height="28" rx="14" fill="#1C1F26" stroke="#3A3834" stroke-width="1"/>
    <text x="73" y="214" text-anchor="middle" fill="#F5F0E6">RAG</text>

    <rect x="116" y="196" width="124" height="28" rx="14" fill="#1C1F26" stroke="#3A3834" stroke-width="1"/>
    <text x="178" y="214" text-anchor="middle" fill="#F5F0E6">System Design</text>

    <rect x="250" y="196" width="112" height="28" rx="14" fill="#1C1F26" stroke="#3A3834" stroke-width="1"/>
    <text x="306" y="214" text-anchor="middle" fill="#F5F0E6">Adaptability</text>

    <rect x="372" y="196" width="158" height="28" rx="14" fill="#1C1F26" stroke="#3A3834" stroke-width="1"/>
    <text x="451" y="214" text-anchor="middle" fill="#F5F0E6">Agent Orchestration</text>
  </g>
</svg>
